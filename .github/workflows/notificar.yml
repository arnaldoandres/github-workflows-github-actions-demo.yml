name: Notificador dolar

on:
  schedule:
    # Horario de bolsa: 8:00 am a 1:00 pm Colombia (13:00-18:00 UTC), lun-vie
    - cron: "*/15 13-17 * * 1-5"
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python notificador.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Guardar valor de hoy
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ultimo.json
          git diff --staged --quiet || git commit -m "Actualiza valor del dolar"
          git push
